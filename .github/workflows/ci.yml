name: CI/CD

on:
  push:
    branches: [ "**" ] # Run on every branch
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run checks and tests
        run: make ci

  image-smoke:
    needs: [ check ]
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build image for smoke test
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: docker/prod.Dockerfile
          load: true
          tags: tg-ai-manager:ci-smoke
          platforms: linux/amd64
      - name: Test isolated image and persistence
        run: sh scripts/smoke-production.sh tg-ai-manager:ci-smoke

  build-and-push:
    needs: [ check ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' # Deploy ONLY on main pushes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to the Container registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Select revision and latest tags
        id: tags
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          latest=''
          revision=''
          while IFS= read -r tag; do
            case "$tag" in
              *:latest) latest="$tag" ;;
              *:sha-*) revision="$tag" ;;
            esac
          done <<< "$IMAGE_TAGS"
          : "${latest:?Missing latest image tag}"
          : "${revision:?Missing revision image tag}"
          printf 'latest=%s\nrevision=%s\n' "$latest" "$revision" >> "$GITHUB_OUTPUT"

      - name: Build image for smoke test
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: docker/prod.Dockerfile
          load: true
          tags: tg-ai-manager:ci-smoke
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

      - name: Test isolated image and persistence
        run: sh scripts/smoke-production.sh tg-ai-manager:ci-smoke

      - name: Build and push revision image
        id: published
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: docker/prod.Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.revision }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

      - name: Verify published image matches smoke-tested image
        env:
          REVISION_TAG: ${{ steps.tags.outputs.revision }}
          IMAGE_DIGEST: ${{ steps.published.outputs.digest }}
        run: |
          image="${REVISION_TAG%:*}@${IMAGE_DIGEST}"
          docker pull "$image"
          tested_id="$(docker image inspect tg-ai-manager:ci-smoke --format '{{.Id}}')"
          published_id="$(docker image inspect "$image" --format '{{.Id}}')"
          if [ "$tested_id" != "$published_id" ]; then
            echo "Published image differs from the smoke-tested image; deployment is blocked." >&2
            exit 1
          fi

      - name: Promote verified image to latest
        env:
          REVISION_TAG: ${{ steps.tags.outputs.revision }}
          LATEST_TAG: ${{ steps.tags.outputs.latest }}
          IMAGE_DIGEST: ${{ steps.published.outputs.digest }}
        run: |
          docker buildx imagetools create --prefer-index=false \
            --tag "$LATEST_TAG" "${REVISION_TAG%:*}@${IMAGE_DIGEST}"

      - name: Trigger deploy
        uses: Mayurifag/multiple-watchtowers-update-action@6a98d6c7f807abecc82a358bb69978157077fee4
        with:
          watchtower-urls: ${{ secrets.WATCHTOWER_URLS }}
          watchtower-tokens: ${{ secrets.WATCHTOWER_TOKENS }}
