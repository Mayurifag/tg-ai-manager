name: CI/CD

on:
  push:
    branches: [ "**" ] # Run on every branch
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          enable-cache: true
          prune-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run checks
        run: make ci

  image-check:
    needs: [ check ]
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/prod.Dockerfile
          platforms: linux/amd64

  build-and-push:
    needs: [ check ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' # Deploy ONLY on main pushes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Select revision and latest tags
        id: tags
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          latest=''
          revision=''
          while IFS= read -r tag; do
            case "$tag" in
              *:latest) latest="$tag" ;;
              *:sha-*) revision="$tag" ;;
            esac
          done <<< "$IMAGE_TAGS"
          : "${latest:?Missing latest image tag}"
          : "${revision:?Missing revision image tag}"
          printf 'latest=%s\nrevision=%s\n' "$latest" "$revision" >> "$GITHUB_OUTPUT"

      - name: Build and push revision image
        id: published
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/prod.Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.revision }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

      - name: Promote revision image to latest
        env:
          REVISION_TAG: ${{ steps.tags.outputs.revision }}
          LATEST_TAG: ${{ steps.tags.outputs.latest }}
          IMAGE_DIGEST: ${{ steps.published.outputs.digest }}
        run: |
          docker buildx imagetools create --prefer-index=false \
            --tag "$LATEST_TAG" "${REVISION_TAG%:*}@${IMAGE_DIGEST}"

      - name: Trigger deploy
        uses: Mayurifag/multiple-watchtowers-update-action@6a98d6c7f807abecc82a358bb69978157077fee4
        with:
          watchtower-urls: ${{ secrets.WATCHTOWER_URLS }}
          watchtower-tokens: ${{ secrets.WATCHTOWER_TOKENS }}
