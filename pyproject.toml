[project]
name = "tg-ai-manager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
  "pydantic-settings>=2.16.3",
  "python-dotenv>=1.2.4",
  "quart>=0.23.1",
  "telethon>=1.46.0",
  "structlog>=26.1.0",
  "redis>=8.1.0",
  "hypercorn>=0.18.0",
  "alembic>=1.20.1",
  "cryptography>=50.0.2",
  "httpx2>=2.16.2",
  "google-genai>=3.6.1",
  "regex>=2026.11.19",
  "certifi>=2026.11.20",
  "pillow>=13.0.0",
]

[dependency-groups]
container = ["supervisor>=4.3.0"]
dev = [
 "ruff>=0.17.6",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
