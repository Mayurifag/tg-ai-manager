[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:valkey]
command=/usr/local/bin/valkey-server --bind 127.0.0.1 --port 6379 --dir /app_data/valkey --save 60 1 --daemonize no --protected-mode yes
priority=100
stopasgroup=true
stopwaitsecs=10
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:app]
# Use absolute path to venv binary to be 100% safe
# In Hypercorn 0.18, zero spawned workers runs one in-process server with
# signal handlers; terminating a spawned worker bypasses ASGI shutdown.
command=/venv/bin/hypercorn src.app:app --bind 0.0.0.0:8000 --workers 0
priority=200
stopasgroup=true
stopwaitsecs=20
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
